name: Keepalive

# O free tier do Supabase pausa projetos sem atividade. Uma consulta por semana evita a pausa.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      # O RLS devolve [], mas a consulta já conta como atividade. A resposta não é impressa.
      - name: Consultar a API
        run: |
          curl -fsS -o /dev/null --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/households?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
